        goodImage.alt = `商品推荐 ${index + 1}`;
        goodLink.href = good.url;

        if (window.innerWidth >= 768) {
          goodQr.src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(good.url)}`;
          goodQrWrap.style.display = 'flex';
        } else {
          goodQrWrap.style.display = 'none';
        }
      };

      const initGoods = () => {
        const mixed = shuffleArray(COMMODITY_DATA);
        let currentIndex = 0;
        renderGood(mixed[0], 0);
        setInterval(() => {
          currentIndex = (currentIndex + 1) % mixed.length;
          renderGood(mixed[currentIndex], currentIndex);
        }, 60000);
      };

      renderVideos(shuffleArray(VIDEO_DATA));
      initGoods();

      window.addEventListener('resize', () => {
        const currentGood = goodLink.href;
        if (currentGood && currentGood !== '#' && window.innerWidth >= 768) {
          goodQr.src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(currentGood)}`;
          goodQrWrap.style.display = 'flex';
        } else if (goodQrWrap) {
          goodQrWrap.style.display = 'none';
        }
      });
    </script>
  </body>
</html>
